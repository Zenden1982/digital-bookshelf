spring.application.name=diplom

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

google.books.api.url=https://www.googleapis.com/books/v1/volumes
# Ключ лучше не хранить в репозитории, но для локальной разработки ок
google.books.api.key=AIzaSyBFCF5qLG9TK8oew6oN_Sjyta19Zq6pHyQ

springdoc.swagger-ui.persist-authorization=true
spring.profiles.active=postgres

# --- Spring AI & Vector Store ---
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.initialize-schema=true

# --- Ollama Models ---
spring.ai.ollama.embedding.enabled=true
spring.ai.ollama.embedding.options.model=embeddinggemma
spring.ai.ollama.chat.options.model=llama3.1
spring.ai.ollama.chat.options.temperature=0.3

# --- Custom Ollama URLs (для разделения Chat/Embeddings) ---
# Эти значения используются в OllamaConfig.java
# По умолчанию (локально) всё смотрит на localhost:11434
# В Docker Compose мы переопределим их через environment variables
app.ollama.chat-url=http://localhost:11434
app.ollama.embedding-url=http://localhost:11434

# --- MVC ---
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
